<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFR elan</title>
    <link rel="stylesheet" href="cfr_stil.css">
</head>
<body>
    <div class="container">
        <h1>CFR elan</h1>
        <div class="signup-box">
            <h3>Qeydiyyat</h3>
            <form id="signupForm">
                <label for="fullname">Ad Soyad:</label><br>
                <input type="text" id="fullname" placeholder="Ad və Soyad daxil edin" required><br><br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="Emailinizi daxil edin" required><br><br>
                <label for="password">Şifrə:</label><br>
                <input type="password" id="password" name="password" placeholder="Şifrənizi daxil edin" required><br><br>
                <label for="confirm_password">Şifrəni təsdiqlə:</label><br>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Şifrənizi təsdiqləyin" required><br><br>
                <button type="submit">Qeydiyyatdan keç</button>
            </form>
            <p>
                Artıq hesabınız var? 
                <a href="cfr_login.html">Daxil olun</a>
            </p>
        </div>
    </div>
    <script>
        document.getElementById("signupForm").addEventListener("submit", function(e) {
            e.preventDefault();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirm_password").value;
            // Şifrə uzunluğu yoxlanışı
            if (password.length < 8) {
                alert("Şifrə minimum 8 simvol olmalıdır!");
                return;
            }
            // Şifrələrin uyğunluğu
            if (password !== confirmPassword) {
                alert("Şifrələr uyğun deyil!");
                return;
            }
            alert("Qeydiyyatdan uğurla keçdiniz!");
        });
    </script>
    <script src="sign_up.js"></script>
</body>
</html>
