<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFR elan</title>
    <link rel="stylesheet" href="cfr_stil.css">
</head>
<body>
    <div class="container">
        <h1>CFR elan</h1>
        <div class="login-box">
            <h3>Daxil ol</h3>
            <form id="loginForm" action="#" method="POST">
             <label for="email">Email:</label><br>
             <input type="email" id="email" name="email" placeholder="Emailinizi daxil edin" required><br><br>
             <label for="password">Şifrə:</label><br>
             <input type="password" id="password" name="password" placeholder="Şifrənizi daxil edin" required><br><br>
             <button type="submit">Daxil ol</button>
            </form>
            <p>
                Hesabınız yoxdur? 
                <a href="cfr_sign_up.html">Qeydiyyatdan keçin</a>
            </p>   
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
